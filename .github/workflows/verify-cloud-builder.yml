name: Verify SAIF AI cloud builder template
on:
  push:
    branches: ["**"]
    paths:
      - 'cloud/builder-template/**'
      - '.github/workflows/verify-cloud-builder.yml'
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: cloud-builder-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SAIF_VERIFIED_MAVEN_DIR: /tmp/saif-verified-maven
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify pinned compiler mirror copy
        working-directory: cloud/builder-template
        run: bash scripts/verify-compiler.sh
      - name: Prepare isolated sample project
        working-directory: cloud/builder-template
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import { prepareApk } from './scripts/prepare-apk.mjs';
          import path from 'node:path';
          await prepareApk({
            input: { prompt: 'Build a sample offline app', assets: [], project: {
              type: 'android', appName: 'SAIF Smoke', packageName: 'com.saifai.smoke',
              // A Studio-like native project: generated manifest refers to an icon
              // that the on-device scaffold does not actually create.
              files: [
                { path: 'app/src/main/AndroidManifest.xml', content:
                  '<manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.saifai.smoke"><application android:icon="@drawable/ic_launcher" android:label="@string/app_name" android:theme="@style/AppTheme"><activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>' },
                { path: 'app/src/main/java/com/saifai/smoke/MainActivity.kt', content:
                  'package com.saifai.smoke\nclass MainActivity : android.app.Activity() { override fun onCreate(savedInstanceState: android.os.Bundle?) { super.onCreate(savedInstanceState); setContentView(R.layout.main) } }' },
                { path: 'app/src/main/res/layout/main.xml', content:
                  '<TextView xmlns:android="http://schemas.android.com/apk/res/android" android:layout_width="match_parent" android:layout_height="match_parent" android:text="@string/app_name" />' },
                { path: 'app/src/main/res/values/strings.xml', content:
                  '<resources><string name="app_name">SAIF Smoke</string></resources>' },
                { path: 'app/src/main/res/values/styles.xml', content:
                  '<resources><style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar" /></resources>' }
              ]
            } },
            assetsRoot: process.env.RUNNER_TEMP,
            outputDir: path.join(process.env.RUNNER_TEMP, 'saif-template-smoke')
          });
          JS
      - name: Compile fixed Android APK template
        shell: bash
        run: |
          set -o pipefail
          cd "$RUNNER_TEMP/saif-template-smoke"
          gradle --version
          gradle :app:assembleDebug --no-daemon --no-configuration-cache 2>&1 | tee "$RUNNER_TEMP/builder-smoke.log"
          test -s app/build/outputs/apk/debug/app-debug.apk
      # A stuck command has to fail its own step. The job-level limit cancels the whole job instead,
      # and a cancelled job skips the failure report at the end.
      - name: Install FFmpeg and fonts
        timeout-minutes: 18
        run: bash cloud/builder-template/scripts/install-media-tools.sh
      - name: Render one-second text video with FFmpeg
        timeout-minutes: 7
        shell: bash
        run: |
          set -euo pipefail
          bounded() {  # bounded <seconds> <command...>: a stuck command fails this step and is named
            local limit="$1" status=0
            shift
            # KILL for the whole process group: after TERM, timeout returns as soon as python exits,
            # and an ffmpeg that survived would keep the pipe to tee open and block the step.
            timeout --signal=KILL "$limit" "$@" || status=$?
            if (( status == 137 )); then
              echo "::error::Timed out after ${limit}s: $1 ${2:-}"
            fi
            return "$status"
          }
          tmp="$(mktemp -d)"
          mkdir -p "$tmp/assets" "$tmp/scratch"
          image=123e4567-e89b-42d3-a456-426614174001
          audio=123e4567-e89b-42d3-a456-426614174002
          bounded 60 ffmpeg -hide_banner -loglevel error -y -f lavfi -i color=c=0xff5100:s=120x120:d=1 \
            -frames:v 1 -c:v png -f image2 -update 1 "$tmp/assets/$image"
          bounded 60 ffmpeg -hide_banner -loglevel error -y -f lavfi -i sine=frequency=440:duration=1 \
            -c:a pcm_s16le -f wav "$tmp/assets/$audio"
          printf '%s\n' "{\"assets\":[{\"assetId\":\"$image\",\"mimeType\":\"image/png\"},{\"assetId\":\"$audio\",\"mimeType\":\"audio/wav\"}],\"project\":{\"type\":\"video\",\"name\":\"Smoke\",\"width\":360,\"height\":360,\"fps\":24,\"bitrate\":5000000,\"durationUs\":1000000,\"items\":[{\"type\":\"text\",\"startUs\":0,\"durationUs\":1000000,\"text\":\"SAIF AI\",\"fontSize\":28,\"color\":\"#ffffff\"},{\"type\":\"image\",\"startUs\":100000,\"durationUs\":700000,\"assetId\":\"$image\"},{\"type\":\"audio\",\"startUs\":0,\"durationUs\":1000000,\"assetId\":\"$audio\"}]}}" > "$tmp/input.json"
          bounded 180 python3 cloud/builder-template/scripts/render_video.py "$tmp/input.json" "$tmp/assets" "$tmp/out.mp4" "$tmp/scratch" \
            2>&1 | tee "$RUNNER_TEMP/video-smoke.log"
          test "$(stat -c '%s' "$tmp/out.mp4")" -gt 1024
          bounded 30 ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1 "$tmp/out.mp4"
          bounded 30 ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of default=noprint_wrappers=1 "$tmp/out.mp4" | grep -q aac
      - name: Report template compilation failure
        if: failure()
        run: |
          if [[ -f "$RUNNER_TEMP/builder-smoke.log" ]]; then
            grep -E '^e: |^FAILURE:|^> Task .*FAILED|Could not resolve|Could not download|Could not GET|Incorrect package|^\s*Caused by:' "$RUNNER_TEMP/builder-smoke.log" | tail -25 | while IFS= read -r line; do echo "::error::$line"; done || true
            tail -55 "$RUNNER_TEMP/builder-smoke.log" | python3 -c 'import sys; text=sys.stdin.read(); print("::error::" + text.replace("%","%25").replace("\r","").replace("\n","%0A")[:4000])'
          fi
          if [[ -s "$RUNNER_TEMP/video-smoke.log" ]]; then
            tail -35 "$RUNNER_TEMP/video-smoke.log" | python3 -c 'import sys; text=sys.stdin.read(); print("::error::" + text.replace("%","%25").replace("\r","").replace("\n","%0A")[:4000])'
          fi
