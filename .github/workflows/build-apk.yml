name: Build Android APK
on:
  push:
    branches: ['arena/**']
  workflow_dispatch:
permissions:
  contents: read
  checks: write
concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: final
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      # Ubuntu hosted runners already include the Android SDK and accepted licenses.
      - name: Check preinstalled Android SDK
        run: ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"
      - name: Check runner Gradle
        run: gradle --version
      - name: Build installable debug APK (tests not requested)
        shell: bash
        run: |
          set -o pipefail
          gradle :app:assembleStandardDebug --no-daemon --no-configuration-cache 2>&1 | tee build-ci.log
      - name: Expose build failures in check annotations
        if: failure()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('build-ci.log')
          if p.exists():
              lines = p.read_text(errors='replace').splitlines()
              errors = [l for l in lines if l.startswith('e: ') or 'Could not resolve' in l or 'Could not find' in l]
              from collections import Counter
              import re
              errors = [re.sub(r'e: file:///.*?/final/app/src/main/java/', '', e) for e in errors]
              counts = Counter(e.split(':')[0] for e in errors)
              text = 'ERRORS BY FILE\n' + '\n'.join(f'{p}: {n}' for p,n in counts.items()) + '\nDETAILS\n' + '\n'.join(errors or lines[-100:])
              for i in range(0, min(len(text), 35000), 3500):
                  chunk = text[i:i+3500].replace('%','%25').replace('\r','').replace('\n','%0A')
                  print('::error::' + chunk)
          PY
      - name: Publish complete compiler diagnostics
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PYTHON'
          import os, json, subprocess, re
          from pathlib import Path
          p = Path('build-ci.log')
          if p.exists():
              lines = p.read_text(errors='replace').splitlines()
              errors = [re.sub(r'e: file:///.*?/final/app/src/main/java/', '', l) for l in lines if l.startswith('e: ')]
              text = '\n'.join(errors or lines[-100:])
              for i in range(0, len(text), 55000):
                  payload = dict(name=f'Compiler diagnostics {i//55000+1}', head_sha=os.environ['GITHUB_SHA'],
                      status='completed', conclusion='neutral', output=dict(title='Build failure details (not an APK)',
                      summary='```text\n'+text[i:i+55000]+'\n```'))
                  subprocess.run(['gh','api','--method','POST',f"repos/{os.environ['GITHUB_REPOSITORY']}/check-runs",'--input','-'],
                      input=json.dumps(payload), text=True, check=True, stdout=subprocess.DEVNULL)
          PYTHON
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_number }}
          path: final/build-ci.log
          if-no-files-found: ignore
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SAIF-AI-debug-${{ github.run_number }}
          path: final/app/build/outputs/apk/standard/debug/*.apk
          if-no-files-found: error
          retention-days: 30
